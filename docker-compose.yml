# Docker Compose for Edge Memory & Intelligence Platform
#
# This runs the "cloud" Qdrant Server that the edge device syncs to.
# The edge device itself runs Qdrant embedded (via qdrant-client path mode)
# so it needs NO container — just the Python app.
#
# Usage:
#   docker-compose up -d        # start cloud Qdrant
#   cd backend && python main.py  # start the edge platform

version: "3.9"

services:
  # ── Cloud Qdrant Server (sync target) ──────────────────────────────
  qdrant-cloud:
    image: qdrant/qdrant:latest
    container_name: qdrant-cloud
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_cloud_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

volumes:
  qdrant_cloud_data:
