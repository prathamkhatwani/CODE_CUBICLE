# Render Blueprint Specification for CORTEX Edge Memory & Intelligence Platform
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cortex-edge-memory-platform
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: EDGE_DEMO_MODE
        value: "true"
      - key: EDGE_EDGE_QDRANT_PATH
        value: "./qdrant_edge_data"
      - key: EDGE_AUTH_ENABLED
        value: "false"
      - key: EDGE_DEVICE_NAME
        value: "Render Cloud Edge Node"
